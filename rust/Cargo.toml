[package]
name = "harbor-llm-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Provider-free execution contracts and bounded bridge framing for Harbor harness integrations"
license = "MIT"
repository = "https://github.com/caniko/harbor"
readme = "README.md"
# protocol and LICENSE are symlinks to the component's shared copies.
include = [
  "/Cargo.toml",
  "/*.rs",
  "/README.md",
  "/LICENSE",
  "/protocol/**",
  "/tests/**",
]

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
