[package]
name = "harbor-llm-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Durable controller-side execution intents and retained delivery for Harbor LLM bridges"
license = "MIT"
repository = "https://github.com/caniko/harbor"

[features]
native-conformance = []

[dependencies]
harbor-llm-protocol = { version = "0.1.0", path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
tempfile = "3"
rustix = { version = "1", features = [
  "process",
  "fs",
  "net",
  "mount",
  "thread",
] }
getrandom = "0.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
